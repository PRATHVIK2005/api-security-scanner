name: CD — Release Assets

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-release-assets:
    name: Build & Upload Release Assets
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── 2. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # ── 4. Run full test suite ────────────────────────────────────────────
      - name: Run pytest before release
        run: |
          python -m pytest -q

      # ── 5. Generate release reports ───────────────────────────────────────
      - name: Generate sample release reports
        run: |
          python - <<'EOF'
          from pathlib import Path

          from scanner.models import ScanResult, Finding, Severity
          from scanner.reports.html_report import generate_html_report
          from scanner.reports.pdf_report import generate_pdf_report


          result = ScanResult(
              target="https://example.com",
              scan_mode="passive",
              endpoints_scanned=1,
              findings=[
                  Finding(
                      title="Sample Finding",
                      severity=Severity.LOW,
                      endpoint="https://example.com",
                      description=(
                          "This is a sample finding "
                          "for the release report."
                      ),
                      recommendation=(
                          "Review and remediate accordingly."
                      ),
                      owasp="API1:2023",
                  )
              ],
          )


          html_content = generate_html_report(result)
          Path("release_report.html").write_text(
              html_content,
              encoding="utf-8",
          )


          pdf_bytes = generate_pdf_report(result)
          Path("release_report.pdf").write_bytes(
              pdf_bytes,
          )


          print("HTML report generated successfully")
          print("PDF report generated successfully")
          EOF

      # ── 6. Verify generated assets ────────────────────────────────────────
      - name: Verify release assets
        run: |
          ls -lh release_report.html release_report.pdf

      # ── 7. Upload release assets ──────────────────────────────────────────
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_report.html
            release_report.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}